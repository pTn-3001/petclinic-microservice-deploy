{{- if .Values.monitoring.enabled }}
{{- range $name, $config := .Values.services }}
{{- if $config.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    release: {{ $.Values.monitoring.releaseLabel | default "kube-prometheus-stack" }}
spec:
  selector:
    matchLabels:
      app: {{ $name }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
{{- end }}
{{- end }}
{{- end }}