{{- range $name, $config := .Values.services }}
{{- if $config.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    app: {{ $name }}
data:
  SPRING_PROFILES_ACTIVE: "docker"
  {{- if ne $name "config-server" }}
  CONFIG_SERVER_URL: "http://config-server:8888/"
  SPRING_CLOUD_CONFIG_URI: "http://config-server:8888"
  {{- end }}
  {{- if and (ne $name "config-server") (ne $name "discovery-server") }}
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
  {{- end }}
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
  MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
  MANAGEMENT_METRICS_TAGS_APPLICATION: "{{ $name }}"
  SPRING_APPLICATION_JSON: '{"management":{"metrics":{"distribution":{"percentiles-histogram":{"http.server.requests":true}}}}}'
{{- end }}
{{- end }}
